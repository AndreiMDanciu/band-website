    <script>
        document.querySelectorAll('section h2').forEach(function (titlu) {
            titlu.addEventListener('mousemove', function (event) {
                const dreptunghi = titlu.getBoundingClientRect();
                const pozitieX = event.clientX - dreptunghi.left;
                const procent = (pozitieX / dreptunghi.width) * 100;
                titlu.style.backgroundPosition = procent + '% 0%';
            });

            titlu.addEventListener('mouseleave', function() {
                titlu.style.backgroundPosition = '50% 0%';
            });
        });
    </script>

    <script>
        const butonHamburger = document.getElementById('hamburger-btn');
        const meniuPrincipal = document.getElementById('meniu-principal');

        butonHamburger.addEventListener('click', function() {
            meniuPrincipal.classList.toggle('meniu-deschis');
            butonHamburger.classList.toggle('activ');
        });

        document.querySelectorAll('#meniu-principal a').forEach(function(link) {
            link.addEventListener('click', function() {
                meniuPrincipal.classList.remove('meniu-deschis');
                butonHamburger.classList.remove('activ');
            });
        });
    </script>

    <script>
        function deschidePopup(videoId) {
            document.getElementById('video-frame').src = 'https://www.youtube.com/embed/' + videoId + '?autoplay=1';
            document.getElementById('link-youtube').href = 'https://www.youtube.com/watch?v=' + videoId;
            document.getElementById('video-popup').classList.add('deschis');
    }

        function inchidePopup() {
            document.getElementById('video-popup').classList.remove('deschis');
            document.getElementById('video-frame').src = '';
    }

        window.addEventListener('click', function(e) {
            const popup = document.getElementById('video-popup');
            if (e.target === popup) {
                inchidePopup();
            }
        });
    </script>

    <script>
        const navbar = document.querySelector('nav');
        const sectiuneHero = document.getElementById('acasa');
        const inaltimeHero = sectiuneHero ? sectiuneHero.offsetHeight : 250;
        const zonaTranzitie = 300;

        function verificaScroll() {
            const scroll = window.scrollY;
            const pragStart = inaltimeHero - zonaTranzitie - 100;

            let progres = (scroll - pragStart) / zonaTranzitie;
            progres = Math.min(Math.max(progres, 0), 1);

            navbar.style.setProperty('--nav-opacity', (progres * 0.95).toFixed(2));
        }

        window.addEventListener('scroll', verificaScroll);
        verificaScroll();
    </script>
